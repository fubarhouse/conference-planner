<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="./img/app-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./img/apple-touch-icon.png">
    <title>No access · Programme</title>
    <style>
      @layer overrides, reset, legacy, tokens, base, composition, section, utility;
    </style>
    <link rel="stylesheet" href="/css/foundation.css" />
    <link rel="stylesheet" href="/css/section-chrome.css" />
    <style>
      /* Error pages are served when something has already gone wrong, so they
         carry no script and depend on nothing but the foundation sheet. If even
         that fails to load the markup still reads top to bottom. */
      .err {
        display: flex;
        flex-direction: column;
        justify-content: center;
        min-block-size: 100dvh;
        max-inline-size: 34rem;
        margin-inline: auto;
        padding: var(--sp-l) 1rem;
      }
      .err__code {
        font-family: var(--font-data);
        font-size: var(--step--1);
        letter-spacing: var(--label-track);
        text-transform: uppercase;
        color: var(--ink-2);
      }
      .err__title {
        font-family: var(--font-display);
        font-size: var(--step-3);
        line-height: 1.1;
        letter-spacing: var(--display-track);
        margin-block: var(--sp-xs) var(--sp-s);
      }
      .err__body {
        font-size: var(--step-0);
        color: var(--ink-1);
        max-inline-size: var(--measure);
      }
      .err__rule {
        border: 0;
        border-block-start: 2px solid var(--ink-0);
        margin-block: var(--sp-l) var(--sp-m);
      }
      .err__links {
        display: flex;
        flex-wrap: wrap;
        gap: var(--sp-s);
      }
      .err__link {
        display: inline-flex;
        align-items: center;
        min-block-size: var(--tap);
        padding-inline: var(--sp-s);
        border: 1px solid var(--ink-0);
        color: var(--ink-0);
        font-size: var(--step--1);
        text-decoration: none;
      }
      .err__link:hover {
        background: var(--paper-2);
      }
    </style>
    <script>
      // Inline and dependency-free on purpose: these pages load when something
      // has already failed, so they must not need the app's JS. This is only
      // enough to honour a colour mode the reader already chose — without it an
      // error page arrives in the opposite scheme to the site they were just
      // reading, which reads as a different site entirely.
      try {
        var m = localStorage.getItem('scheduleColourMode');
        if (m === 'light' || m === 'dark') document.documentElement.dataset.mode = m;
      } catch (e) {
        /* private mode, storage disabled — fall through to the OS preference */
      }
    </script>
  </head>
  <body>
    <main class="err">
      <p class="err__code">Error 403</p>
      <h1 class="err__title">This is not yours to see.</h1>
      <p class="err__body">
        You are signed in, but this page needs a level of access your account does not have.
        If that is wrong, whoever administers this instance can change it.
      </p>
      <hr class="err__rule" />
      <div class="err__links">
        <a class="err__link" href="/planner">My planner</a>
        <a class="err__link" href="/schedules">Browse schedules</a>
        <a class="err__link" href="/logout">Sign out</a>
      </div>
    </main>
  </body>
</html>
